{% extends "base.html" %}{% block content %}<h1 class="h2 mb-3">Products · {{ shop.name }}</h1>
<div class="panel mb-4"><form method="post" class="row g-2 align-items-end"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="col-md-5"><label class="form-label">Product name</label><input class="form-control" name="name" required></div>
<div class="col-md-3"><label class="form-label">Price (INR)</label><input class="form-control" type="number" name="price" min="0" step="0.01" required></div>
<div class="col-md-2"><label class="form-label">Stock</label><input class="form-control" type="number" name="stock" min="0" required></div>
<div class="col-md-2"><button class="btn btn-primary w-100">Add product</button></div></form></div>
<div class="panel table-responsive"><table class="table mb-0"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Marketplace</th></tr></thead><tbody>{% for p in products %}<tr><td>{{ p.name }}</td><td>₹{{ '%.2f'|format(p.price) }}</td><td>{{ p.stock_qty }}</td><td>{{ 'Listed' if p.is_listed else 'Hidden' }}</td></tr>{% else %}<tr><td colspan="4">No products added yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
