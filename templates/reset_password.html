{% extends "base.html" %}
{% block title %}Choose a new password — SmartBill{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-main"><div class="auth-card">
<div class="eyebrow dark-eyebrow">ACCOUNT RECOVERY</div><h2>Choose a new password</h2>
<p class="auth-intro">Use at least 12 characters. This reset link can only be used once.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">New password</label><input class="form-control" type="password" name="password" minlength="12" required autocomplete="new-password">
<label class="form-label mt-3">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="12" required autocomplete="new-password">
<button class="btn btn-dark btn-lg rounded-pill w-100 mt-4">Update password</button></form>
</div></div></section>
{% endblock %}
