{% extends "base.html" %}
{% block title %}Verify email — SmartBill{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-main"><div class="auth-card">
<div class="eyebrow dark-eyebrow">EMAIL VERIFICATION</div><h2>Send a new verification link</h2>
<p class="auth-intro">Enter the email address used for your SmartBill account. Verification links expire after 60 minutes.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email address</label><input class="form-control" type="email" name="email" required autocomplete="email">
<button class="btn btn-dark btn-lg rounded-pill w-100 mt-4">Resend verification email</button></form>
<div class="auth-switch"><a href="{{ url_for('auth.consumer_login') }}">Back to sign in</a></div>
</div></div></section>
{% endblock %}
