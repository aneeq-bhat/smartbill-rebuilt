{% extends "base.html" %}{% block title %}My profile — SmartBill{% endblock %}{% block content %}
<section class="dashboard-shell"><div class="container-xl py-5"><div class="dashboard-heading"><div><div class="eyebrow dark-eyebrow">ACCOUNT SETTINGS</div><h1>Your profile.</h1><p>Keep your account details up to date.</p></div></div><div class="workspace-card p-4 mt-4" style="max-width:640px"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="name" value="{{ user.name }}" maxlength="120" required></div><div class="mb-3"><label class="form-label">Email address</label><input class="form-control" value="{{ user.email }}" readonly><div class="form-text">Email changes are disabled until email verification is implemented.</div></div><button class="btn btn-accent rounded-pill px-4">Save profile</button></form></div></div></section>{% endblock %}
