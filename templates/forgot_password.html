{% extends "base.html" %}
{% block title %}Forgot password — SmartBill{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-main"><div class="auth-card">
<div class="eyebrow dark-eyebrow">ACCOUNT RECOVERY</div><h2>Reset your password</h2>
<p class="auth-intro">Enter your account email. If an active account exists, we'll send a single-use reset link that expires in 30 minutes.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email address</label><input class="form-control" type="email" name="email" required autocomplete="email">
<button class="btn btn-dark btn-lg rounded-pill w-100 mt-4">Send reset link</button></form>
<div class="auth-switch"><a href="{{ url_for('auth.consumer_login') }}">Back to sign in</a></div>
</div></div></section>
{% endblock %}
