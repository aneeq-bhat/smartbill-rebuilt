{% extends "base.html" %}{% block content %}<div class="auth-card mx-auto"><h1 class="h3">Create consumer account</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Full name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (12+ characters)</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Create account</button></form></div>{% endblock %}
