{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="auth-card mx-auto"><h1 class="h3 mb-4">{{ title }}</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required autocomplete="username">
<label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required autocomplete="current-password">
<button class="btn btn-primary w-100">Sign in</button></form></div>{% endblock %}
